<div class="admin-page">
  <div class="page-header">
    <h2>Roles & Permissions</h2>
  </div>

  <div class="settings-grid">
    <div class="settings-card">
      <h3><i class="fa-solid fa-users-gear"></i> Role Management</h3>
      <div class="settings-form">
        <div class="settings-list">
          @for (role of roles; track role.name) {
            <div class="list-row">
              <div>
                <h4>{{ role.name }} <span class="role-tag">{{ role.permissionLevel }}</span></h4>
                <p>{{ role.description }}</p>
                <small>{{ role.users }} assigned user(s)</small>
              </div>
              <button class="danger-btn" type="button" (click)="deleteRole(role)">Remove</button>
            </div>
          }
        </div>

        <div class="role-add">
          <div class="form-group">
            <label>New Role Name</label>
            <input type="text" [(ngModel)]="newRole.name" name="newRoleName" />
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" [(ngModel)]="newRole.description" name="newRoleDescription" />
          </div>
          <div class="form-group">
            <label>Permission Level</label>
            <select [(ngModel)]="newRole.permissionLevel" name="newRoleLevel">
              <option value="Read-only">Read-only</option>
              <option value="Limited">Limited</option>
              <option value="Full">Full</option>
            </select>
          </div>
          <button class="save-btn" type="button" (click)="addRole()">Add Role</button>
        </div>

        @if (roleError) {
          <p class="form-message error">{{ roleError }}</p>
        }
        @if (message) {
          <p class="form-message success">{{ message }}</p>
        }
      </div>
    </div>
  </div>
</div>
