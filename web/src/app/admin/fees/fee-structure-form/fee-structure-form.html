<div class="overlay" (click)="close()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <div>
        <h3>{{ existingStructure ? 'Edit Fee Structure' : 'Add Fee Structure' }}</h3>
        <p>Configure the selected fee type for the chosen school and grades.</p>
      </div>
      <button class="close-btn" type="button" (click)="close()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="dialog-body">
      <div class="context-card">
        <span>School</span>
        <strong>{{ selectedSchoolName || 'No school selected' }}</strong>
      </div>

      <div class="form-grid">
        <label class="form-field">
          <span>Term</span>
          <select [(ngModel)]="feeStructure.term" name="feeStructureTerm">
            @for (term of termOptions; track term) {
              <option [ngValue]="term">{{ getTermLabel(term) }}</option>
            }
          </select>
        </label>

        <label class="form-field">
          <span>Academic Year</span>
          <input type="text" [(ngModel)]="feeStructure.academicYear" name="feeStructureAcademicYear" placeholder="2026" />
        </label>

        <label class="form-field">
          <span>Fee Type</span>
          <select [(ngModel)]="selectedFeeType" (ngModelChange)="onFeeTypeChange()" name="feeType">
            @for (option of feeTypeOptions; track option.value) {
              <option [ngValue]="option.value">{{ option.label }}</option>
            }
          </select>
          <small class="helper-text">{{ feeTypeHelperText }}</small>
        </label>

        <label class="form-field">
          <span>Amount</span>
          <input type="number" min="0" step="0.01" [(ngModel)]="amount" name="feeAmount" />
        </label>
      </div>

      <div class="total-card">
        <span>Selected Amount</span>
        <strong>{{ totalAmount | number:'1.2-2' }}</strong>
      </div>
    </div>

    <div class="dialog-actions">
      <button type="button" class="secondary-btn" (click)="close()">Cancel</button>
      <button type="button" class="primary-btn" (click)="onSubmit()">
        {{ existingStructure ? 'Save Changes' : 'Create Fee Structure' }}
      </button>
    </div>
  </div>
</div>
