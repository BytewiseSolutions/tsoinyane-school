<div class="admin-page">
  <div class="page-header">
    <h2>Security Controls</h2>
  </div>

  <div class="settings-grid">
    <div class="settings-card">
      <h3><i class="fa-solid fa-shield-halved"></i> Security Policies</h3>
      <form class="settings-form" (ngSubmit)="saveSecuritySettings()">
        <label class="toggle-row">
          <span>Enable Two-Factor Authentication</span>
          <input type="checkbox" [(ngModel)]="securitySettings.twoFactor" name="twoFactor" />
        </label>
        <label class="toggle-row">
          <span>Enable Audit Logging</span>
          <input type="checkbox" [(ngModel)]="securitySettings.auditLogging" name="auditLogging" />
        </label>
        <label class="toggle-row">
          <span>Restrict Access By IP</span>
          <input type="checkbox" [(ngModel)]="securitySettings.allowIpRestriction" name="allowIpRestriction" />
        </label>
        <div class="form-row">
          <div class="form-group">
            <label>Session Timeout (minutes)</label>
            <input type="number" min="5" [(ngModel)]="securitySettings.sessionTimeoutMinutes" name="sessionTimeoutMinutes" />
          </div>
          <div class="form-group">
            <label>Password Expiry (days)</label>
            <input type="number" min="0" [(ngModel)]="securitySettings.passwordExpiryDays" name="passwordExpiryDays" />
          </div>
        </div>
        <div class="form-group">
          <label>IP Whitelist</label>
          <textarea rows="3" placeholder="Comma-separated IP addresses" [(ngModel)]="securitySettings.ipWhitelist" name="ipWhitelist"></textarea>
        </div>

        @if (message) {
          <p class="form-message success">{{ message }}</p>
        }

        <button type="submit" class="save-btn">Save Security Settings</button>
      </form>
    </div>
  </div>
</div>
