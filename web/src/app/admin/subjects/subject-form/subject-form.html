<div class="student-form-overlay" (click)="close()">
  <div class="student-form-card" (click)="$event.stopPropagation()">

    <div class="form-header">
      <h3>{{ isEdit ? 'Edit Subject' : 'Add Subject' }}</h3>
      <button class="close-btn" (click)="close()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <form class="form-body" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Subject Code</label>
          <input type="text" placeholder="e.g. MATH-01" [(ngModel)]="subject.code" name="code" required />
        </div>
        <div class="form-group">
          <label>School</label>
          <input type="text" [value]="schoolName || 'Current school required'" readonly />
        </div>
      </div>

      <div class="form-group">
        <label>Subject Name</label>
        <input type="text" placeholder="e.g. Mathematics" [(ngModel)]="subject.name" name="name" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Grade</label>
          @if (gradeOptions.length === 0) {
            <p class="form-hint error">No grades found. Please <a routerLink="/admin/grades" (click)="close()">create grades</a> first.</p>
          } @else {
            <select [(ngModel)]="subject.gradeId" name="gradeId" required>
              <option [ngValue]="null">Select grade</option>
              @for (grade of gradeOptions; track grade.id) {
                <option [ngValue]="grade.id">{{ grade.name }}</option>
              }
            </select>
          }
        </div>
        <div class="form-group">
          <label>Status</label>
          <select [(ngModel)]="subject.status" name="status">
            @for (status of statusOptions; track status) {
              <option [ngValue]="status">{{ status }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Teacher</label>
        <select [(ngModel)]="subject.teacherId" name="teacherId" required>
          <option [ngValue]="null">Select teacher</option>
          @for (teacher of teacherOptions; track teacher.id) {
            <option [ngValue]="teacher.id">{{ teacher.name }}</option>
          }
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="close()">Cancel</button>
        <button type="submit" class="submit-btn">{{ isEdit ? 'Update' : 'Add Subject' }}</button>
      </div>

    </form>

  </div>
</div>
