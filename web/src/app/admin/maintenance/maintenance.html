<div class="admin-page">
  <div class="page-header">
    <h2>Maintenance</h2>
  </div>

  <div class="settings-grid">
    <div class="settings-card">
      <h3><i class="fa-solid fa-database"></i> Backup & Maintenance</h3>
      <form class="settings-form" (ngSubmit)="saveMaintenanceSettings()">
        <label class="toggle-row">
          <span>Enable Automatic Backups</span>
          <input type="checkbox" [(ngModel)]="maintenanceSettings.autoBackup" name="autoBackup" />
        </label>
        <label class="toggle-row">
          <span>Maintenance Mode</span>
          <input type="checkbox" [(ngModel)]="maintenanceSettings.maintenanceMode" name="maintenanceMode" />
        </label>
        <div class="form-row">
          <div class="form-group">
            <label>Backup Frequency</label>
            <select [(ngModel)]="maintenanceSettings.backupFrequency" name="backupFrequency">
              <option value="Daily">Daily</option>
              <option value="Weekly">Weekly</option>
              <option value="Monthly">Monthly</option>
            </select>
          </div>
          <div class="form-group">
            <label>Retention Period (days)</label>
            <input type="number" min="1" [(ngModel)]="maintenanceSettings.retentionDays" name="retentionDays" />
          </div>
        </div>
        @if (maintenanceMessage) {
          <p class="form-message success">{{ maintenanceMessage }}</p>
        }
        <div class="inline-actions">
          <button type="submit" class="save-btn">Save Maintenance Settings</button>
          <button type="button" class="secondary-btn" (click)="runBackupNow()">Run Backup Now</button>
        </div>
      </form>
    </div>

    <div class="settings-card">
      <h3><i class="fa-solid fa-user-shield"></i> Administrator Controls</h3>
      <div class="settings-form">
        <p class="admin-note">
          Administrator has full control over system configuration, data import/export, and full reset actions.
        </p>
        <div class="inline-actions">
          <button type="button" class="secondary-btn" (click)="exportSystemConfig()">Export Config</button>
          <button type="button" class="secondary-btn" (click)="importInput.click()">Import Config</button>
          <input #importInput type="file" accept=".json,application/json" class="hidden-input" (change)="importSystemConfig($event)" />
          <button type="button" class="danger-strong-btn" (click)="resetSystemData()">Reset System Data</button>
        </div>
        @if (adminMessage) {
          <p class="form-message success">{{ adminMessage }}</p>
        }
      </div>
    </div>
  </div>
</div>
