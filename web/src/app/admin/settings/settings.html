<div class="admin-page">
  <div class="page-header">
    <h2>Settings</h2>
  </div>

  <div class="settings-grid">

    <div class="settings-card">
      <h3><i class="fa-solid fa-school"></i> School Information</h3>
      <form class="settings-form" (ngSubmit)="saveSchoolInfo()">
        <div class="form-group">
          <label>School Name</label>
          <input type="text" [(ngModel)]="schoolInfo.schoolName" name="schoolName" required />
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" [(ngModel)]="schoolInfo.location" name="location" required />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" [(ngModel)]="schoolInfo.phone" name="phone" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="schoolInfo.email" name="email" required />
        </div>
        @if (schoolMessage) {
          <p class="form-message success">{{ schoolMessage }}</p>
        }
        <button type="submit" class="save-btn">Save Changes</button>
      </form>
    </div>

    <div class="settings-card">
      <h3><i class="fa-solid fa-lock"></i> Change Password</h3>
      <form class="settings-form" (ngSubmit)="updatePassword()">
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" placeholder="Enter current password" [(ngModel)]="passwordForm.currentPassword" name="currentPassword" />
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" placeholder="Enter new password" [(ngModel)]="passwordForm.newPassword" name="newPassword" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" placeholder="Confirm new password" [(ngModel)]="passwordForm.confirmPassword" name="confirmPassword" />
        </div>
        @if (passwordError) {
          <p class="form-message error">{{ passwordError }}</p>
        }
        @if (passwordMessage) {
          <p class="form-message success">{{ passwordMessage }}</p>
        }
        <button type="submit" class="save-btn">Update Password</button>
      </form>
    </div>

  </div>
</div>
