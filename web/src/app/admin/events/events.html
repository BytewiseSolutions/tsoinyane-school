<div class="admin-page">
  <div class="page-header">
    <h2>Events</h2>
    <button class="add-btn" (click)="openForm()"><i class="fa-solid fa-plus"></i> Add Event</button>
  </div>

  <div class="table-card">
    <div class="table-toolbar">
      <input type="text" placeholder="Search events..." />
    </div>
    <table>
      <thead>
        <tr>
          <th>Event</th>
          <th>Date</th>
          <th>Location</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (event of events; track event.name) {
          <tr>
            <td>{{ event.name }}</td>
            <td>{{ event.date | date: 'MMM d, y' }}</td>
            <td>{{ event.location }}</td>
            <td><span class="badge" [class.active]="event.status === 'Upcoming'" [class.inactive]="event.status === 'Past'">{{ event.status }}</span></td>
            <td class="actions">
              <button class="edit-btn" (click)="openForm(event)"><i class="fa-solid fa-pen"></i></button>
              <button class="delete-btn" (click)="deleteEvent(event)"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

@if (showForm) {
  <app-event-form
    [existingEvent]="selectedEvent"
    (closed)="closeForm()"
    (saved)="onSaved($event)" />
}
