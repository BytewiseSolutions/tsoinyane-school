<div class="student-form-overlay" (click)="close()">
  <div class="student-form-card" (click)="$event.stopPropagation()">

    <div class="form-header">
      <h3>{{ isEdit ? 'Edit Teacher' : 'Add Teacher' }}</h3>
      <button class="close-btn" (click)="close()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <form class="form-body" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" placeholder="Enter first name" [(ngModel)]="teacher.firstName" name="firstName" required />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" placeholder="Enter last name" [(ngModel)]="teacher.lastName" name="lastName" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Gender</label>
          <select [(ngModel)]="teacher.gender" name="gender">
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" placeholder="+266 XXXX XXXX" [(ngModel)]="teacher.phone" name="phone" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Subject</label>
          <input type="text" placeholder="e.g. Mathematics" [(ngModel)]="teacher.subject" name="subject" />
        </div>
        <div class="form-group">
          <label>School</label>
          <select [(ngModel)]="teacher.school" name="school">
            <option value="">Select school</option>
            <option value="Primary">Primary School</option>
            <option value="High School">High School</option>
            <option value="Both">Both</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="teacher.status" name="status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="close()">Cancel</button>
        <button type="submit" class="submit-btn">{{ isEdit ? 'Update' : 'Add Teacher' }}</button>
      </div>

    </form>

  </div>
</div>
