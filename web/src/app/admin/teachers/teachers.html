<div class="admin-page">
  <div class="page-header">
    <h2>Teachers</h2>
    <button class="add-btn" (click)="openForm()"><i class="fa-solid fa-plus"></i> Add Teacher</button>
  </div>

  <div class="table-card">
    <div class="table-toolbar">
      <input type="text" placeholder="Search teachers..." />
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Subject</th>
          <th>School</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (teacher of teachers; track teacher.firstName) {
          <tr>
            <td>{{ teacher.firstName }} {{ teacher.lastName }}</td>
            <td>{{ teacher.subject }}</td>
            <td>{{ teacher.school }}</td>
            <td>{{ teacher.phone }}</td>
            <td><span class="badge" [class.active]="teacher.status === 'Active'" [class.inactive]="teacher.status === 'Inactive'">{{ teacher.status }}</span></td>
            <td class="actions">
              <button class="edit-btn" (click)="openForm(teacher)"><i class="fa-solid fa-pen"></i></button>
              <button class="delete-btn" (click)="deleteTeacher(teacher)"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

@if (showForm) {
  <app-teacher-form
    [existingTeacher]="selectedTeacher"
    (closed)="closeForm()"
    (saved)="onSaved($event)" />
}
