<section class="login-section">
  <div class="login-card">
    <h2>Sign In</h2>
    <p>Welcome back to Tsoinyane Government Combined School</p>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required />
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          <span>Remember Me</span>
        </label>
        <button type="button" class="forgot-password" (click)="onForgotPassword()">Forgot Password?</button>
      </div>
      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button type="submit" class="submit-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>
  </div>
</section>
