<!-- HERO -->
<section class="page-hero">
  <div class="page-hero-content">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you at {{ schoolName }}</p>
  </div>
</section>

<!-- CONTACT -->
<section class="contact-section">

  <div class="contact-info-cards">
    <div class="info-card">
      <i class="fa-solid fa-phone"></i>
      <h3>Phone</h3>
      <p><a [href]="phoneLink">{{ phone }}</a></p>
    </div>
    <div class="info-card">
      <i class="fa-solid fa-envelope"></i>
      <h3>Email</h3>
      <p><a [href]="emailLink">{{ email }}</a></p>
    </div>
    <div class="info-card">
      <i class="fa-solid fa-location-dot"></i>
      <h3>Address</h3>
      <p><a [href]="locationLink" target="_blank" rel="noopener noreferrer">{{ location }}</a></p>
    </div>
  </div>

  <div class="map-wrapper">
    <iframe
      [src]="mapEmbedUrl"
      width="100%"
      height="450"
      style="border:0;"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

</section>
