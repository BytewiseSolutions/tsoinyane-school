<section class="forgot-password-section">
  <div class="forgot-password-card">
    <h2>Forgot Password</h2>
    <p>Enter your email address and we will send you reset instructions.</p>

    <form class="forgot-password-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required />
      </div>

      <button type="submit">Send Reset Link</button>
      <a class="back-link" routerLink="/login">Back to Sign In</a>
    </form>
  </div>
</section>
